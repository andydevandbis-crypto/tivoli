<style>

* {

html,body {
    margin:0;

   INFORMATIONSRUTA

    position:fixed;
    top:calc(15px + env(safe-area-inset-top,0px));
    left:calc(15px + env(safe-area-inset-left,0px));

}

   NIVÅ
===================================================== */

#level {
    position:fixed;
    top:calc(15px + env(safe-area-inset-top,0px));
    right:calc(15px + env(safe-area-inset-right,0px));
    z-index:20;

    padding:clamp(7px,1.8vw,10px) clamp(12px,3.2vw,18px);

    color:white;
    background:#e63e68;

    border:3px solid white;
    border-radius:15px;

    font-size:clamp(14px,3.6vw,18px);

}

    transform:translate(-50%,-50%);

    text-shadow:
        4px 4px 0 #c92f58,

}

   LANDSKAPSRUTA
===================================================== */

#landscapePrompt {

    position:fixed;

    inset:0;

    z-index:9999;

    display:none;

    align-items:center;
    justify-content:center;

    padding:

        calc(20px + env(safe-area-inset-right,0px))
        calc(20px + env(safe-area-inset-bottom,0px))

    background:
        linear-gradient(
            135deg,

}


#landscapePrompt .promptBox {

#landscapePrompt .phoneIcon {

}


#landscapePrompt h2 {

    font-size:
        clamp(25px,7vw,36px);

}


#landscapePrompt p {

        clamp(16px,4.5vw,21px);

}


#landscapePrompt strong {

}


@keyframes landscapePulse {

    }

        transform:scale(1.025);

}


@keyframes rotatePhone {

    0% {
        transform:rotate(0deg);

        transform:rotate(0deg);
    }

}

<body>

     LANDSKAPSRUTA
===================================================== -->

<div id="landscapePrompt">

    <div class="promptBox">

        <div class="phoneIcon">
            📱
        </div>

        <h2>
            Vrid mobilen!
        </h2>

            i <strong>landskapsläge</strong> 🎪
        </p>

    </div>

</div>


<!-- =====================================================
     SPELINFORMATION
===================================================== -->

<div id="info">
    🎪 Help the monkey reach its owner
</div>


<div id="message"></div>


<canvas id="canvas"></canvas>


<script>


/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const message =
document.getElementById("message");


let W = 0;
let H = 0;

let scale = 1;


function resize(){

    const realW =
        (window.visualViewport &&
         window.visualViewport.width) ||
        window.innerWidth;


    const realH =
        (window.visualViewport &&
         window.visualViewport.height) ||
        window.innerHeight;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.floor(
            realW*dpr
        );


    canvas.height =
        Math.floor(
            realH*dpr
        );


    canvas.style.width =
        realW+"px";


    canvas.style.height =
        realH+"px";


    scale =
        Math.min(
            Math.max(
                realH/700,
                .62
            ),
            1.8
        );


    W =
        realW/scale;


    H =
        realH/scale;


    ctx.setTransform(
        dpr*scale,
        0,
        0,
        dpr*scale,
        0,
        0
    );


    if(gameReady){

        setupLevel();

    }

}


let gameReady = false;


window.addEventListener(
    "resize",
    resize
);


window.addEventListener(
    "orientationchange",
    resize
);


if(window.visualViewport){

    window.visualViewport.addEventListener(
        "resize",
        resize
    );

}


resize();



/* =====================================================
   SPEL
===================================================== */

let gameStarted = true;

let dragging = false;

let dragStartX = 0;

let dragAmount = 0;

let maximumDrag = 0;

let lightTime = 0;

let ferrisAngle = 0;

let restartTimer = null;

let gameWaitingForRestart = false;



/* =====================================================
   GUNGA
===================================================== */

const swing = {

    anchorX:0,

    anchorY:105,

    ropeLength:190,

    angle:0,

    velocity:0,

    acceleration:0,

    damping:.997,

    x:0,

    y:0,

    monkeyReleased:false

};



/* =====================================================
   APA
===================================================== */

const monkey = {

    x:0,

    y:0,

    vx:0,

    vy:0,

    attached:true,

    rotation:0,

    type:1

};



/* =====================================================
   FÅNGARE
===================================================== */

const catcher = {

    x:0,

    y:0,

    catchRadius:60,

    happy:false,

    type:"girl"

};



/* =====================================================
   BALLONGER
===================================================== */

let balloons = [];



/* =====================================================
   LADDA BANA
===================================================== */

function setupLevel(){

    if(restartTimer !== null){

        clearTimeout(
            restartTimer
        );

        restartTimer = null;

    }


    gameWaitingForRestart =
        false;


    dragging = false;

    dragAmount = 0;

    maximumDrag = 0;


    message.style.opacity =
        "0";


    message.textContent =
        "";


    swing.anchorX =
        W*.28;

    swing.anchorY =
        105;

    swing.angle =
        0;

    swing.velocity =
        0;

    swing.acceleration =
        0;

    swing.monkeyReleased =
        false;


    monkey.attached =
        true;

    monkey.vx =
        0;

    monkey.vy =
        0;

    monkey.rotation =
        0;

    monkey.type =
        1;


    catcher.x =
        W*.82;

    catcher.y =
        H-90;

    catcher.type =
        "girl";

    catcher.happy =
        false;


    balloons = [

        {

            x:W*.50,

            y:H*.43,

            radius:28,

            color:"#ff4775",

            popped:false,

            popTime:0

        },


        {

            x:W*.62,

            y:H*.58,

            radius:25,

            color:"#ffd83d",

            popped:false,

            popTime:0

        },


        {

            x:W*.72,

            y:H*.38,

            radius:27,

            color:"#55cbe6",

            popped:false,

            popTime:0

        },


        {

            x:W*.77,

            y:H*.65,

            radius:24,

            color:"#8ddd5c",

            popped:false,

            popTime:0

        }

    ];


    updatePositions();

}



/* =====================================================
   INPUT
===================================================== */

canvas.addEventListener(
    "pointerdown",
    e=>{

        if(!gameStarted)
            return;


        if(gameWaitingForRestart)
            return;


        if(swing.monkeyReleased)
            return;


        dragging = true;


        dragStartX =
            e.clientX;


        dragAmount =
            0;


        maximumDrag =
            0;


        canvas.setPointerCapture(
            e.pointerId
        );

    }
);



canvas.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;


        if(gameWaitingForRestart)
            return;


        const distance =
            (
                dragStartX -
                e.clientX
            )/scale;


        dragAmount =
            Math.max(
                0,
                distance
            );


        dragAmount =
            Math.min(
                350,
                dragAmount
            );


        maximumDrag =
            Math.max(
                maximumDrag,
                dragAmount
            );

    }
);



canvas.addEventListener(
    "pointerup",
    ()=>{

        if(!dragging)
            return;


        if(gameWaitingForRestart){

            dragging =
                false;

            return;

        }


        dragging =
            false;


        const power =
            maximumDrag/350;


        swing.velocity =
            power*.075;


        swing.angle =
            -power*1.15;

    }
);



/* =====================================================
   POSITION
===================================================== */

function updatePositions(){

    swing.x =
        swing.anchorX+
        Math.sin(
            swing.angle
        )*
        swing.ropeLength;


    swing.y =
        swing.anchorY+
        Math.cos(
            swing.angle
        )*
        swing.ropeLength;


    if(monkey.attached){

        monkey.x =
            swing.x;

        monkey.y =
            swing.y-42;

    }

}



/* =====================================================
   GUNGAN
===================================================== */

function updateSwing(){

    if(!gameStarted)
        return;


    /*
       Gungan fortsätter svänga även efter
       MISS eller CAUGHT.

       Dragning är däremot avstängd under
       väntetiden.
    */

    if(
        dragging &&
        !swing.monkeyReleased &&
        !gameWaitingForRestart
    ){

        const power =
            dragAmount/350;


        swing.angle =
            -power*1.15;


        swing.velocity =
            0;


        updatePositions();

        return;

    }


    const gravity =
        .00065;


    swing.acceleration =
        -gravity*
        Math.sin(
            swing.angle
        );


    swing.velocity +=
        swing.acceleration;


    swing.velocity *=
        swing.damping;


    swing.angle +=
        swing.velocity;


    updatePositions();


    if(
        !swing.monkeyReleased &&
        !gameWaitingForRestart &&
        swing.velocity>0 &&
        swing.angle>.70 &&
        maximumDrag>15
    ){

        releaseMonkey();

    }

}



/* =====================================================
   KASTA APA
===================================================== */

function releaseMonkey(){

    swing.monkeyReleased =
        true;


    monkey.attached =
        false;


    const power =
        maximumDrag/350;


    const tangentialSpeed =
        swing.velocity*
        swing.ropeLength;


    monkey.vx =
        Math.abs(
            tangentialSpeed
        )+
        power*11;


    monkey.vy =
        -power*7;


    monkey.x =
        swing.x;


    monkey.y =
        swing.y-42;


    monkey.rotation =
        0;

}



/* =====================================================
   BALLONG-KOLLISION
===================================================== */

function checkBalloonCollision(){

    for(
        const balloon of balloons
    ){

        if(balloon.popped)
            continue;


        const dx =
            monkey.x-
            balloon.x;


        const dy =
            monkey.y-
            balloon.y;


        const distance =
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        if(
            distance<
            balloon.radius+22
        ){

            popBalloon(
                balloon
            );

        }

    }

}



/* =====================================================
   SPRÄCK BALLONG
===================================================== */

function popBalloon(
    balloon
){

    if(balloon.popped)
        return;


    balloon.popped =
        true;


    balloon.popTime =
        1;


    message.textContent =
        "POP! 💥";


    message.style.opacity =
        "1";


    setTimeout(
        ()=>{

            if(
                !gameWaitingForRestart
            ){

                message.style.opacity =
                    "0";

            }

        },
        350
    );

}



/* =====================================================
   APA
===================================================== */

function updateMonkey(){

    if(monkey.attached)
        return;


    if(gameWaitingForRestart)
        return;


    monkey.vy +=
        .42;


    monkey.x +=
        monkey.vx;


    monkey.y +=
        monkey.vy;


    monkey.vx *=
        .998;


    monkey.rotation +=
        .08;


    checkBalloonCollision();


    const dx =
        monkey.x-
        catcher.x;


    const dy =
        monkey.y-
        (
            catcher.y-85
        );


    const distance =
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    if(
        distance<
        catcher.catchRadius &&
        monkey.vy>0
    ){

        catchMonkey();

        return;

    }


    /*
       MISS 1:
       Apan flyger utanför spelområdet.
    */

    if(
        monkey.x>W+100 ||
        monkey.x<-100 ||
        monkey.y>H+100
    ){

        missMonkey();

        return;

    }


    const ground =
        H-75;


    /*
       MISS 2:
       Apan träffar marken.
    */

    if(monkey.y>ground){

        monkey.y =
            ground;


        missMonkey();

        return;

    }

}



/* =====================================================
   MISS + 5 SEKUNDERS OMSTART
===================================================== */

function missMonkey(){

    if(gameWaitingForRestart)
        return;


    gameWaitingForRestart =
        true;


    message.textContent =
        "MISS!";


    message.style.opacity =
        "1";


    restartTimer =
        setTimeout(
            ()=>{

                setupLevel();

            },
            5000
        );

}



/* =====================================================
   VINST
===================================================== */

function catchMonkey(){

    if(gameWaitingForRestart)
        return;


    gameWaitingForRestart =
        true;


    monkey.vx =
        0;


    monkey.vy =
        0;


    monkey.x =
        catcher.x;


    monkey.y =
        catcher.y-85;


    catcher.happy =
        true;


    message.textContent =
        "CAUGHT! 🎉";


    message.style.opacity =
        "1";


    /*
       Efter lyckad fångst laddas banan om
       efter 5 sekunder.
    */

    restartTimer =
        setTimeout(
            ()=>{

                setupLevel();

            },
            5000
        );

}



/* =====================================================
   BAKGRUND
===================================================== */

function drawBackground(){

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    sky.addColorStop(
        0,
        "#5fc8f0"
    );


    sky.addColorStop(
        .55,
        "#c7eff8"
    );


    sky.addColorStop(
        1,
        "#ffd5e2"
    );


    ctx.fillStyle =
        sky;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );

}



/* =====================================================
   LAMPOR
===================================================== */

function drawLights(){

    lightTime +=
        .08;


    const colors = [

        "#ffd83d",

        "#ff4b72",

        "#5ce1e6",

        "#ffffff",

        "#8be35c"

    ];


    for(
        let x=15;
        x<W;
        x+=42
    ){

        const index =
            Math.floor(
                x/42
            );


        const color =
            colors[
                (
                    index+
                    Math.floor(
                        lightTime
                    )
                )%
                colors.length
            ];


        const pulse =
            .65+
            Math.sin(
                lightTime*2+
                index
            )*.35;


        ctx.save();


        ctx.globalAlpha =
            pulse;


        ctx.shadowColor =
            color;


        ctx.shadowBlur =
            18;


        ctx.fillStyle =
            color;


        ctx.beginPath();


        ctx.arc(
            x,
            25,
            7,
            0,
            Math.PI*2
        );


        ctx.fill();


        ctx.restore();

    }

}



/* =====================================================
   FLAGGOR
===================================================== */

function drawFlags(){

    ctx.strokeStyle =
        "#754263";


    ctx.lineWidth =
        3;


    ctx.beginPath();


    ctx.moveTo(
        0,
        65
    );


    ctx.quadraticCurveTo(
        W/2,
        125,
        W,
        65
    );


    ctx.stroke();


    const colors = [

        "#ff4775",

        "#ffd83d",

        "#46cce4",

        "#8ddd5c"

    ];


    let i =
        0;


    for(
        let x=20;
        x<W;
        x+=45
    ){

        const y =
            70+
            Math.sin(
                x/W*Math.PI
            )*35;


        ctx.fillStyle =
            colors[
                i%
                colors.length
            ];


        ctx.beginPath();


        ctx.moveTo(
            x,
            y
        );


        ctx.lineTo(
            x+23,
            y+5
        );


        ctx.lineTo(
            x+11,
            y+30
        );


        ctx.closePath();


        ctx.fill();


        i++;

    }

}



/* =====================================================
   PARISERHJUL
===================================================== */

function drawFerrisWheel(){

    const x =
        W*.87;


    const y =
        H*.34;


    const r =
        Math.min(
            100,
            W*.12
        );


    ferrisAngle +=
        .003;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        ferrisAngle
    );


    ctx.shadowColor =
        "#ffd83d";


    ctx.shadowBlur =
        15;


    ctx.strokeStyle =
        "#ffd33e";


    ctx.lineWidth =
        7;


    ctx.beginPath();


    ctx.arc(
        0,
        0,
        r,
        0,
        Math.PI*2
    );


    ctx.stroke();


    for(
        let i=0;
        i<8;
        i++
    ){

        const a =
            i*Math.PI/4;


        ctx.beginPath();


        ctx.moveTo(
            0,
            0
        );


        ctx.lineTo(
            Math.cos(a)*r,
            Math.sin(a)*r
        );


        ctx.stroke();

    }


    for(
        let i=0;
        i<8;
        i++
    ){

        const a =
            i*Math.PI/4;


        const gx =
            Math.cos(a)*r;


        const gy =
            Math.sin(a)*r;


        ctx.fillStyle =
            i%3===0
            ? "#ff4d78"
            : i%3===1
            ? "#42cbe3"
            : "#ffd83d";


        ctx.fillRect(
            gx-11,
            gy,
            22,
            17
        );

    }


    ctx.shadowBlur =
        0;


    ctx.fillStyle =
        "#fff";


    ctx.beginPath();


    ctx.arc(
        0,
        0,
        10,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.restore();


    ctx.strokeStyle =
        "#d63d65";


    ctx.lineWidth =
        8;


    ctx.beginPath();


    ctx.moveTo(
        x-45,
        H-75
    );


    ctx.lineTo(
        x,
        y
    );


    ctx.lineTo(
        x+45,
        H-75
    );


    ctx.stroke();

}



/* =====================================================
   TIVOLITÄLT
===================================================== */

function drawTent(){

    const x =
        W*.56;


    const baseY =
        H-75;


    const width =
        Math.min(
            240,
            W*.28
        );


    const height =
        150;


    ctx.fillStyle =
        "#e63e67";


    ctx.beginPath();


    ctx.moveTo(
        x-width/2,
        baseY
    );


    ctx.lineTo(
        x,
        baseY-height
    );


    ctx.lineTo(
        x+width/2,
        baseY
    );


    ctx.closePath();


    ctx.fill();


    ctx.fillStyle =
        "#ffd83d";


    ctx.beginPath();


    ctx.moveTo(
        x-width/2,
        baseY
    );


    ctx.lineTo(
        x-width/6,
        baseY
    );


    ctx.lineTo(
        x,
        baseY-height
    );


    ctx.lineTo(
        x-35,
        baseY
    );


    ctx.closePath();


    ctx.fill();


    ctx.beginPath();


    ctx.moveTo(
        x+width/6,
        baseY
    );


    ctx.lineTo(
        x+width/2,
        baseY
    );


    ctx.lineTo(
        x,
        baseY-height
    );


    ctx.lineTo(
        x+35,
        baseY
    );


    ctx.closePath();

/* =====================================================
   BALLONGER
===================================================== */

function drawBalloons(){

    for(
        const b of balloons
    ){

        if(b.popped){

            if(b.popTime>0){

                b.popTime -=
                    .08;


                ctx.save();


                ctx.globalAlpha =
                    Math.max(
                        0,
                        b.popTime
                    );


                ctx.fillStyle =
                    b.color;


                for(
                    let i=0;
                    i<6;
                    i++
                ){

                    const a =
                        i*Math.PI/3;


                    const distance =
                        (
                            1-
                            b.popTime
                        )*35;


                    ctx.beginPath();


                    ctx.arc(
                        b.x+
                        Math.cos(a)*
                        distance,

                        b.y+
                        Math.sin(a)*
                        distance,

                        5,

                        0,

                        Math.PI*2
                    );


                    ctx.fill();

                }


                ctx.restore();

            }


            continue;

        }


        drawBalloon(b);

    }

}



/* =====================================================
   BALLONG
===================================================== */

function drawBalloon(b){

    ctx.save();


    ctx.strokeStyle =
        "#777";


    ctx.lineWidth =
        2;


    ctx.beginPath();


    ctx.moveTo(
        b.x,
        b.y+b.radius
    );


    ctx.quadraticCurveTo(
        b.x-8,
        b.y+b.radius+20,
        b.x,
        b.y+b.radius+38
    );


    ctx.stroke();


    ctx.fillStyle =
        b.color;


    ctx.strokeStyle =
        "white";


    ctx.lineWidth =
        3;


    ctx.beginPath();


    ctx.ellipse(
        b.x,
        b.y,
        b.radius*.78,
        b.radius,
        0,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.stroke();


    ctx.fillStyle =
        "rgba(255,255,255,.65)";


    ctx.beginPath();


    ctx.ellipse(
        b.x-b.radius*.25,
        b.y-b.radius*.32,
        b.radius*.16,
        b.radius*.28,
        -.4,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.fillStyle =
        b.color;


    ctx.beginPath();


    ctx.moveTo(
        b.x-5,
        b.y+b.radius-2
    );


    ctx.lineTo(
        b.x+5,
        b.y+b.radius-2
    );


    ctx.lineTo(
        b.x,
        b.y+b.radius+9
    );


    ctx.closePath();


    ctx.fill();


    ctx.restore();

}

function drawMonkey(){

    const x =

    const y =
        monkey.y;


    ctx.save();


    if(!monkey.attached){

        ctx.translate(
            x,
            y
        );


        ctx.rotate(
            monkey.rotation
        );


        drawCuteMonkey(
            0,
            0
        );

    }
    else{

        drawCuteMonkey(
            x,
            y
        );

    }


    ctx.restore();

}
