<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="amusement-park.ico" type="image/x-icon">
    <title>Tivolihjul – Välj språk</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                radial-gradient(circle at 20% 10%, #ffe66d 0, transparent 22%),
                radial-gradient(circle at 85% 15%, #ff6b8a 0, transparent 24%),
                radial-gradient(circle at 50% 100%, #62d9ff 0, transparent 30%),
                #ff5c8a;
        }

        .language-card {
            width: min(600px, 100%);
            padding: 35px 25px;
            border-radius: 28px;
            background: rgba(255,255,255,.95);
            text-align: center;
            color: #222;
            box-shadow:
                0 20px 45px rgba(0,0,0,.22),
                inset 0 0 0 4px rgba(255,255,255,.7);
        }

        .decoration {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: clamp(40px, 10vw, 70px);
            font-weight: 1000;
            letter-spacing: 3px;
            color: #fff;
            text-shadow:
                4px 4px 0 #e51d4f,
                7px 7px 0 rgba(0,0,0,.18);
        }

        .subtitle {
            margin: 15px 0 25px;
            font-size: 19px;
            font-weight: bold;
        }

        .languages {
            display: grid;
            gap: 14px;
        }

        .language-button {
            display: block;
            width: 100%;
            padding: 17px 20px;
            border: 0;
            border-radius: 15px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 5px 0 rgba(0,0,0,.15);
            transition: transform .12s, filter .12s;
        }

        .language-button:hover {
            filter: brightness(1.05);
        }

        .language-button:active {
            transform: translateY(2px);
        }

        .swedish {
            background: linear-gradient(135deg, #1769aa, #2188d4);
        }

        .english {
            background: linear-gradient(135deg, #e51d4f, #ff6b3d);
        }

        .polish {
            background: linear-gradient(135deg, #d62828, #b5179e);
        }
    </style>
</head>

<body>

    <main class="language-card">

        <div class="decoration">
            🎪 ✨ 🎡 ✨ 🎪
        </div>

        <h1>TIVOLIHJUL</h1>

        <p class="subtitle">
            Välj språk / Choose language / Wybierz język
        </p>

        <div class="languages">

            <a class="language-button swedish" href="svenska.html">
                🇸🇪 Svenska
            </a>

            <a class="language-button english" href="english.html">
                🇬🇧 English
            </a>

            <a class="language-button polish" href="polski.html">
                🇵🇱 Polski
            </a>

        </div>

    </main>

</body>
</html>
