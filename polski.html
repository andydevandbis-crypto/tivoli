<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <link rel="icon" href="amusement-park.ico" type="image/x-icon">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tivolihjul</title>

    <style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 20% 10%, #ffe66d 0, transparent 22%),
        radial-gradient(circle at 85% 15%, #ff6b8a 0, transparent 24%),
        radial-gradient(circle at 50% 100%, #62d9ff 0, transparent 30%),
        #ff5c8a;
    color: #fff;
    overflow-x: hidden;
}

body {
    min-height: 100vh;
}

.screen {
    width: 100%;
}

.setup-screen {
    min-height: 100vh;
    padding: 25px 15px 45px;
}

.top-decoration {
    text-align: center;
    font-size: 30px;
    margin-bottom: 5px;
}

h1 {
    margin: 0;
    text-align: center;
    font-size: clamp(42px, 9vw, 78px);
    font-weight: 1000;
    letter-spacing: 4px;
    line-height: .95;
    color: #fff;
    text-shadow:
        4px 4px 0 #e51d4f,
        7px 7px 0 rgba(0,0,0,.18);
}

.subtitle {
    text-align: center;
    margin: 15px 0 22px;
    font-size: 17px;
    font-weight: bold;
}

.setup-card {
    width: min(900px, 100%);
    margin: auto;
    padding: 20px;
    border-radius: 24px;
    background: rgba(255,255,255,.94);
    color: #222;
    box-shadow:
        0 15px 35px rgba(0,0,0,.18),
        inset 0 0 0 4px rgba(255,255,255,.7);
}

.count-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 14px;
    font-weight: 900;
}

#count {
    width: 85px;
    padding: 10px;
    border: 3px solid #ff4d75;
    border-radius: 10px;
    font-size: 19px;
    font-weight: bold;
    text-align: center;
    background: #fff;
}

.wheel-name-row {
    margin-top: 15px;
    margin-bottom: 15px;
}

.wheel-name-label {
    display: block;
    margin-bottom: 7px;
    text-align: center;
    font-size: 17px;
    font-weight: 900;
    color: #333;
}

#wheelName {
    width: 100%;
    padding: 10px;
    border: 3px solid #ff4d75;
    border-radius: 10px;
    outline: none;
    background: #fff;
    color: #222;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
}

button {
    border: 0;
    cursor: pointer;
    font-family: inherit;
    font-weight: 900;
    -webkit-user-select: none;
    user-select: none;
}

.primary-button,
.start-button {
    width: 100%;
    min-height: 55px;
    border-radius: 14px;
    font-size: 18px;
    color: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
}

.primary-button {
    background: linear-gradient(135deg, #ff4d75, #ff8a3d);
}

.start-button {
    margin-top: 18px;
    background: linear-gradient(135deg, #17b978, #00a6d6);
}

.primary-button:active,
.start-button:active,
.small-button:active {
    transform: translateY(2px);
}

.inputs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-top: 15px;
}

.input-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px;
    border-radius: 10px;
    background: #fff;
}

.input-number {
    width: 25px;
    flex: 0 0 25px;
    text-align: center;
    font-weight: 900;
    color: #555;
}

.input-row input {
    width: 100%;
    min-width: 0;
    padding: 9px;
    border: 3px solid var(--piece-color, #ff4d75);
    border-radius: 8px;
    outline: none;
    background: #fff;
    color: #222;
    font-size: 15px;
    font-weight: bold;
}

.counter {
    font-size: 10px;
    color: #777;
    white-space: nowrap;
}

.game-screen {
    display: none;
    min-height: 100vh;
    padding: 10px 12px 25px;
    flex-direction: column;
    background:
        radial-gradient(circle at 15% 15%, #ffe66d 0, transparent 18%),
        radial-gradient(circle at 85% 12%, #ff6b8a 0, transparent 20%),
        linear-gradient(135deg, #ff5b75, #ff9a3d 45%, #1cc8a0);
}

.game-header {
    width: 100%;
    max-width: 1300px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 10px;
}

.small-button {
    min-height: 42px;
    padding: 0 13px;
    border-radius: 12px;
    background: linear-gradient(135deg, #fff, #ffe66d);
    color: #222;
    font-size: 14px;
    box-shadow: 0 4px 0 rgba(0,0,0,.16);
    transition: transform .12s, filter .12s;
}

.small-button:hover {
    filter: brightness(1.05);
}

.sound-button[aria-pressed="false"] {
    background: rgba(255,255,255,.76);
    opacity: .82;
}

.game-title {
    text-align: center;
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 1000;
    letter-spacing: 3px;
    text-shadow:
        3px 3px 0 #e51d4f,
        5px 5px 0 rgba(0,0,0,.15);
}

.game-main {
    width: 100%;
    max-width: 1300px;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.wheel-area {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px 0 8px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
}

.wheel-wrap {
    position: relative;
    width: min(86vw, 720px);
    height: min(86vw, 720px);
    container-type: inline-size;
    container-name: wheelwrap;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
}

.pointer {
    position: absolute;
    top: -4px;
    left: 50%;
    width: 52px;
    height: 62px;
    transform: translateX(-50%);
    z-index: 20;
    background: #1769aa;
    border: 4px solid #ffd928;
    clip-path: polygon(
        50% 100%,
        0 0,
        100% 0
    );
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.35));
}

.flag-cross {
    position: absolute;
    inset: 7px 8px 15px;
    background:
        linear-gradient(
            to right,
            transparent 0 40%,
            #ffd928 40% 60%,
            transparent 60%
        ),
        linear-gradient(
            to bottom,
            transparent 0 42%,
            #ffd928 42% 62%,
            transparent 62%
        );
}

.light-ring {
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
}

.wheel-light {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: .8;
    box-shadow:
        0 0 9px rgba(255,255,255,.95),
        0 0 16px currentColor;
    transition:
        opacity .08s,
        transform .08s,
        box-shadow .08s;
}

.wheel-light.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.45);
    box-shadow:
        0 0 15px 5px rgba(255,255,255,1),
        0 0 28px currentColor;
}

.light-ring.flash-all .wheel-light {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.6);
    box-shadow:
        0 0 15px 6px #fff,
        0 0 30px currentColor;
}

.clown {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 21%;
    height: 21%;
    transform: translate(-50%, -50%);
    z-index: 15;
    pointer-events: none;
}

.clown-face {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 70%;
    height: 70%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #fff5d7;
    border: calc(4px + .3vw) solid #ef476f;
    box-shadow: 0 4px 8px rgba(0,0,0,.25);
}

.clown-hat {
    position: absolute;
    left: 50%;
    bottom: 84%;
    transform: translateX(-50%);
    z-index: 2;
    font-size: 9cqw;
    line-height: 1;
}

.eye {
    position: absolute;
    top: 35%;
    width: 9.3%;
    height: 13%;
    border-radius: 50%;
    background: #222;
}

.eye.left {
    left: 26%;
}

.eye.right {
    right: 26%;
}

.nose {
    position: absolute;
    left: 50%;
    top: 47%;
    width: 20.4%;
    height: 20.4%;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #ef3340;
}

.mouth {
    position: absolute;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    color: #222;
    font-size: 5.3cqw;
    font-weight: bold;
}

.result {
    display: block;
    width: min(850px, 94%);
    margin: 8px auto 0;
    padding: 12px 18px 18px;
    border-radius: 22px;
    text-align: center;
    background: rgba(255,255,255,.96);
    color: #222;
    box-shadow: 0 10px 25px rgba(0,0,0,.2);
}

.result-decoration {
    font-size: 22px;
}

.result-title {
    margin-top: 2px;
    color: #e51d4f;
    font-size: 13px;
    font-weight: 1000;
    letter-spacing: 3px;
}

.result-value {
    margin-top: 4px;
    min-height: 42px;
    font-size: clamp(25px, 5vw, 42px);
    font-weight: 1000;
    word-break: break-word;
}

.game-hint {
    display: none;
}

.confetti-piece {
    position: fixed;
    width: 9px;
    height: 15px;
    z-index: 9999;
    pointer-events: none;
    border-radius: 2px;
}

@media (orientation: landscape) and (min-width: 700px) {
    .game-screen {
        min-height: 100vh;
        padding: 6px 12px;
    }

    .game-header {
        grid-template-columns: auto 1fr auto auto;
    }

    .wheel-area {
        padding: 4px 0;
    }

    .wheel-wrap {
        width: min(78vh, 760px);
        height: min(78vh, 760px);
    }

    .result {
        margin-top: 2px;
        padding: 6px 15px 10px;
    }

    .result-decoration {
        display: none;
    }
}

@media (max-width: 600px) and (orientation: portrait) {
    .setup-screen {
        padding: 15px 10px 30px;
    }

    .top-decoration {
        font-size: 24px;
    }

    .setup-card {
        padding: 14px;
    }

    .inputs {
        grid-template-columns: 1fr;
    }

    .game-header {
        grid-template-columns: auto 1fr auto;
    }

    .fullscreen-button {
        display: none;
    }

    .game-title {
        max-width: calc(100% - 120px);
        font-size: clamp(24px, 7vw, 38px);
        letter-spacing: 2px;
    }

    .small-button {
        font-size: 12px;
        min-height: 38px;
        padding: 0 8px;
    }

    .wheel-area {
        padding: 8px 0 5px;
        min-height: 0;
    }

    .wheel-wrap {
        width: min(92vw, 62vh, 560px);
        height: min(92vw, 62vh, 560px);
    }

    .result {
        width: min(94%, 850px);
        margin-top: 4px;
        padding: 8px 12px 12px;
    }

    .result-value {
        font-size: clamp(22px, 6vw, 36px);
    }

    .wheel-light {
        width: 12px;
        height: 12px;
    }
}

@media (orientation: landscape) and (max-width: 699px) {
    .game-screen {
        min-height: 100dvh;
        height: 100dvh;
        padding: 5px 8px 8px;
    }

    .game-header {
        position: absolute;
        left: 8px;
        top: 5px;
        width: auto;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
    }

    .game-title {
        position: absolute;
        left: 50vw;
        top: 5px;
        transform: translateX(-50%);
        max-width: 60vw;
        font-size: clamp(22px, 5vw, 32px);
    }

    .game-main {
        min-height: 0;
        width: 100%;
        padding: 0;
    }

    .wheel-area {
        flex: 1;
        min-height: 0;
        padding: 2px 0;
    }

    .wheel-wrap {
        width: min(72vw, 68vh, 520px);
        height: min(72vw, 68vh, 520px);
    }

    .result {
        position: absolute;
        right: 2px;
        left: auto;
        top: 50%;
        transform: translateY(-50%);
        width: min(28vw, 240px);
        margin: 0;
        padding: 8px;
        z-index: 20;
    }

    .result-decoration {
        display: none;
    }

    .result-title {
        margin-top: 0;
    }

    .result-value {
        min-height: 30px;
        margin-top: 2px;
        font-size: clamp(18px, 3.5vw, 30px);
    }

    .wheel-light {
        width: 12px;
        height: 12px;
    }
}

@media (orientation: landscape) and (max-width: 699px) {
    .result {
        position: absolute;
        right: 2px;
        left: auto;
        top: 50%;
        transform: translateY(-50%);
        width: min(28vw, 240px);
        margin: 0;
        z-index: 20;
    }
}
    </style>
</head>

<body>

<div id="setupScreen" class="screen setup-screen">

    <div class="top-decoration">🎪 ✨ 🎡 ✨ 🎪</div>

    <h1>TIVOLIHJUL</h1>

    <p id="subtitle" class="subtitle">
        Fyll i namnen och starta sedan hjulet!
    </p>

    <section class="setup-card">

        <div class="count-row">
            <label id="countLabel" for="count">Antal tårtbitar</label>

            <input
                id="count"
                type="number"
                min="2"
                max="50"
                value="8"
            >
        </div>

        <button id="createWheel" class="primary-button">
            🎡 SKAPA HJUL
        </button>

        <div class="wheel-name-row">
            <label
                id="wheelNameLabel"
                for="wheelName"
                class="wheel-name-label"
            >
                Skriv ditt namn
            </label>

            <input
                id="wheelName"
                type="text"
                maxlength="30"
                placeholder="Skriv ditt namn..."
            >
        </div>

        <div id="inputs" class="inputs"></div>

        <button id="startWheel" class="start-button">
            🎪 STARTA HJULET
        </button>

    </section>

</div>


<div id="gameScreen" class="screen game-screen">

    <div class="game-header">

        <button id="backButton" class="small-button">
            ← Tillbaka
        </button>

        <div id="gameTitle" class="game-title">
            🎡 TIVOLIHJUL
        </div>

        <button
            id="fullscreenButton"
            class="small-button fullscreen-button"
            type="button"
        >
            ⛶ Helskärm
        </button>

        <button
            id="soundButton"
            class="small-button sound-button"
            type="button"
            aria-pressed="true"
        >
            🔊 Ljud
        </button>

    </div>


    <main class="game-main">

        <div class="wheel-area">

            <div class="wheel-wrap">

                <div class="pointer" aria-hidden="true">
                    <div class="flag-cross"></div>
                </div>

                <div
                    id="lightRing"
                    class="light-ring"
                    aria-hidden="true"
                ></div>

                <canvas
                    id="wheel"
                    width="1000"
                    height="1000"
                ></canvas>

                <div class="clown" aria-hidden="true">

                    <div class="clown-hat">🎩</div>

                    <div class="clown-face">

                        <span class="eye left"></span>
                        <span class="eye right"></span>

                        <span class="nose"></span>

                        <span class="mouth">⌣</span>

                    </div>

                </div>

            </div>

        </div>


        <section id="result" class="result">

            <div class="result-decoration">
                🎉 ✨ 🎉
            </div>

            <div id="resultTitle" class="result-title">
                VINNARE
            </div>

            <div id="resultValue" class="result-value">
                -
            </div>

        </section>

    </main>


    <div id="gameHint" class="game-hint">
        Dra på hjulet för att snurra!
    </div>

</div>


<audio
    id="backgroundAudio"
    loop
    preload="auto"
    src="circus effect.mp3"
></audio>

<audio
    id="spinAudio"
    loop
    preload="auto"
    src="wheel-roll.mp3"
></audio>


<script>
"use strict";

/* =========================================================
   SPRÅK
========================================================= */

const translations = {

    sv: {
        subtitle: "Fyll i namnen och starta sedan hjulet!",
        countLabel: "Antal tårtbitar",
        createWheel: "🎡 SKAPA HJUL",
        wheelNameLabel: "Skriv ditt namn",
        wheelNamePlaceholder: "Skriv ditt namn...",
        namePlaceholder: "Skriv ditt namn...",
        startWheel: "🎪 STARTA HJULET",
        back: "← Tillbaka",
        fullscreen: "⛶ Helskärm",
        sound: "🔊 Ljud",
        soundOff: "🔇 Ljud av",
        winner: "VINNARE",
        spinWheel: "Snurra hjulet",
        spinning: "Snurrar...",
        winnerPrefix: "Vinnare: "
    },

    en: {
        subtitle: "Enter the names and then start the wheel!",
        countLabel: "Number of pieces",
        createWheel: "🎡 CREATE WHEEL",
        wheelNameLabel: "Enter your name",
        wheelNamePlaceholder: "Enter your name...",
        namePlaceholder: "Enter your name...",
        startWheel: "🎪 START THE WHEEL",
        back: "← Back",
        fullscreen: "⛶ Fullscreen",
        sound: "🔊 Sound",
        soundOff: "🔇 Sound off",
        winner: "WINNER",
        spinWheel: "Spin the wheel",
        spinning: "Spinning...",
        winnerPrefix: "Winner: "
    },

    pl: {
        subtitle: "Wpisz imiona, a następnie uruchom koło!",
        countLabel: "Liczba pól",
        createWheel: "🎡 UTWÓRZ KOŁO",
        wheelNameLabel: "Wpisz swoje imię",
        wheelNamePlaceholder: "Wpisz swoje imię...",
        namePlaceholder: "Wpisz swoje imię...",
        startWheel: "🎪 URUCHOM KOŁO",
        back: "← Wstecz",
        fullscreen: "⛶ Pełny ekran",
        sound: "🔊 Dźwięk",
        soundOff: "🔇 Dźwięk wyłączony",
        winner: "ZWYCIĘZCA",
        spinWheel: "Zakręć kołem",
        spinning: "Losowanie...",
        winnerPrefix: "Zwycięzca: "
    }

};

let currentLanguage = "pl";

function setLanguage(language) {

    if (!translations[language]) {
        language = "sv";
    }

    currentLanguage = language;

    const t = translations[currentLanguage];

    document.documentElement.lang = currentLanguage;

    document.getElementById("subtitle").textContent =
        t.subtitle;

    document.getElementById("countLabel").textContent =
        t.countLabel;

    document.getElementById("createWheel").textContent =
        t.createWheel;

    document.getElementById("wheelNameLabel").textContent =
        t.wheelNameLabel;

    document.getElementById("wheelName").placeholder =
        t.wheelNamePlaceholder;

    document.getElementById("startWheel").textContent =
        t.startWheel;

    document.getElementById("backButton").textContent =
        t.back;

    document.getElementById("fullscreenButton").textContent =
        t.fullscreen;

    document.getElementById("soundButton").textContent =
        soundEnabled ? t.sound : t.soundOff;

    document.getElementById("resultTitle").textContent =
        t.winner;

    document.getElementById("gameHint").textContent =
        t.spinWheel;

    updateInputPlaceholders();

    if (!gameStarted) {
        setResult(t.spinWheel);
    }
}

function updateInputPlaceholders() {

    const inputs =
        inputsContainer.querySelectorAll("input");

    const placeholder =
        translations[currentLanguage].namePlaceholder;

    inputs.forEach(input => {
        input.placeholder = placeholder;
    });
}


/* =========================================================
   ELEMENT
========================================================= */

const canvas =
    document.getElementById("wheel");

const ctx =
    canvas.getContext("2d");

const countInput =
    document.getElementById("count");

const createButton =
    document.getElementById("createWheel");

const startButton =
    document.getElementById("startWheel");

const wheelNameInput =
    document.getElementById("wheelName");

const inputsContainer =
    document.getElementById("inputs");

const lightRing =
    document.getElementById("lightRing");

const setupScreen =
    document.getElementById("setupScreen");

const gameScreen =
    document.getElementById("gameScreen");

const gameTitle =
    document.getElementById("gameTitle");

const backButton =
    document.getElementById("backButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const soundButton =
    document.getElementById("soundButton");

const backgroundAudio =
    document.getElementById("backgroundAudio");

const spinAudio =
    document.getElementById("spinAudio");

const resultValue =
    document.getElementById("resultValue");


/* =========================================================
   DATA
========================================================= */

const colors = [
    "#ef476f",
    "#118ab2",
    "#06d6a0",
    "#ffd166",
    "#8338ec",
    "#ff7b00",
    "#00b4d8",
    "#f72585",
    "#43aa8b",
    "#ff595e"
];

const lightColors = [
    "#ff1744",
    "#ffd600",
    "#00e676",
    "#00b8ff",
    "#7c4dff",
    "#ff4081",
    "#ffffff"
];

let values = [];

let rotation = 0;
let velocity = 0;

let dragging = false;
let actuallyDragged = false;
let isSpinning = false;

let lastAngle = 0;
let lastTime = 0;

let animationId = null;

let stopping = false;
let stopStart = 0;
let stopDuration = 0;

let startRotation = 0;
let targetRotation = 0;

let flashTimer = null;
let lastLightIndex = -1;

let gameStarted = false;


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;
let lastTickTime = 0;
let soundEnabled = true;
let backgroundTimer = null;
let backgroundStep = 0;

function playTone(
    frequency,
    duration = 0.12,
    volume = 0.035,
    type = "sine"
) {
    if (!audioContext || !soundEnabled) return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    const now =
        audioContext.currentTime;

    osc.type = type;
    osc.frequency.value = frequency;

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start(now);
    osc.stop(now + duration + 0.02);
}

function startBackgroundMusic() {
    if (backgroundAudio?.src) {

        backgroundAudio.volume = 0.18;

        backgroundAudio.play()
            .then(() => {
                stopSyntheticBackgroundMusic();
            })
            .catch(() => {
                startSyntheticBackgroundMusic();
            });

        return;
    }

    startSyntheticBackgroundMusic();
}

function startSyntheticBackgroundMusic() {

    if (
        backgroundTimer ||
        !soundEnabled
    ) {
        return;
    }

    const melody = [
        392,
        494,
        587,
        494,
        440,
        523,
        659,
        523
    ];

    backgroundTimer =
        setInterval(() => {

            playTone(
                melody[
                    backgroundStep++ %
                    melody.length
                ],
                0.18,
                0.018,
                "triangle"
            );

        }, 620);
}

function stopSyntheticBackgroundMusic() {

    clearInterval(
        backgroundTimer
    );

    backgroundTimer = null;
}

function stopBackgroundMusic() {

    if (backgroundAudio) {
        backgroundAudio.pause();
        backgroundAudio.currentTime = 0;
    }

    stopSyntheticBackgroundMusic();
}

function startSpinAudio() {

    if (
        !spinAudio ||
        !soundEnabled ||
        !spinAudio.src
    ) {
        return;
    }

    spinAudio.volume = 0.42;
    spinAudio.playbackRate = 0.85;

    spinAudio.play().catch(() => {});
}

function updateSpinAudio() {

    if (
        !spinAudio ||
        spinAudio.paused
    ) {
        return;
    }

    const speed =
        Math.min(
            1,
            Math.abs(velocity) / 0.80
        );

    spinAudio.playbackRate =
        0.8 + speed * 1.25;

    spinAudio.volume =
        0.12 + speed * 0.38;
}

function stopSpinAudio() {

    if (!spinAudio) return;

    spinAudio.pause();
    spinAudio.currentTime = 0;
}

function ensureAudio() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) return;

        audioContext =
            new AudioContext();
    }

    if (
        audioContext.state ===
        "suspended"
    ) {
        audioContext.resume();
    }
}

function playTick() {

    if (
        !audioContext ||
        !soundEnabled
    ) {
        return;
    }

    const now =
        performance.now();

    if (
        now - lastTickTime <
        45
    ) {
        return;
    }

    lastTickTime = now;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = "sine";

    osc.frequency.value =
        stopping ? 540 : 360;

    gain.gain.setValueAtTime(
        0.0001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        stopping ? 0.07 : 0.035,
        audioContext.currentTime + 0.004
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + 0.06
    );

    osc.connect(gain);
    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime +
        0.065
    );
}

function playWinSound() {

    if (
        !audioContext ||
        !soundEnabled
    ) {
        return;
    }

    [0, 0.11, 0.22, 0.33]
        .forEach((offset, i) => {

            const osc =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            const notes = [
                523,
                659,
                784,
                1046
            ];

            osc.type = "triangle";

            osc.frequency.value =
                notes[i];

            gain.gain.setValueAtTime(
                0.0001,
                audioContext.currentTime +
                offset
            );

            gain.gain.exponentialRampToValueAtTime(
                0.11,
                audioContext.currentTime +
                offset +
                0.015
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                audioContext.currentTime +
                offset +
                0.22
            );

            osc.connect(gain);

            gain.connect(
                audioContext.destination
            );

            osc.start(
                audioContext.currentTime +
                offset
            );

            osc.stop(
                audioContext.currentTime +
                offset +
                0.24
            );
        });
}


/* =========================================================
   RANDOM
========================================================= */

function secureRandomInt(max) {

    if (max <= 1) {
        return 0;
    }

    const array =
        new Uint32Array(1);

    crypto.getRandomValues(array);

    return array[0] % max;
}

function secureRandomFloat() {

    const array =
        new Uint32Array(1);

    crypto.getRandomValues(array);

    return array[0] / 4294967296;
}


/* =========================================================
   TEXT LIMIT
========================================================= */

function getMaxCharacters(count) {

    if (count <= 4) return 25;
    if (count <= 8) return 18;
    if (count <= 12) return 14;
    if (count <= 20) return 10;
    if (count <= 30) return 8;

    return 6;
}


/* =========================================================
   INPUTS
========================================================= */

function createInputs() {

    let count =

            countInput.value,

        );

    }

        );

        row.appendChild(counter);

}


/* =========================================================
   LIGHTS
========================================================= */

function createLights() {

    lightRing.innerHTML = "";

    const count =
        values.length;

    const radius = 47;

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const light =
            document.createElement("div");

        light.className =
            "wheel-light";

        const angle =
            ((i + 0.5) / count) *
            Math.PI * 2 -
            Math.PI / 2;

        light.style.left =
            `${50 + Math.cos(angle) * radius}%`;

        light.style.top =
            `${50 + Math.sin(angle) * radius}%`;

        const color =
            lightColors[
                i % lightColors.length
            ];

        light.style.background =
            color;

        light.style.color =
            color;

        lightRing.appendChild(light);
    }

    lastLightIndex = -1;
}

function updateLights() {

    const lights =
        lightRing.children;

    const count =
        lights.length;

    if (!count) return;

    const slice =
        Math.PI * 2 / count;

    const pointerAngle =
        getPointerAngle();

    let index =
        Math.floor(
            pointerAngle / slice
        );

    index =
        (
            index % count +
            count
        ) %
        count;

    for (
        let i = 0;
        i < count;
        i++
    ) {
        lights[i]
            .classList
            .remove("active");
    }

    lights[index]
        .classList
        .add("active");

    if (
        index !== lastLightIndex &&
        animationId !== null
    ) {
        playTick();
    }

    lastLightIndex =
        index;
}


/* =========================================================
   ALL LIGHTS FLASH
========================================================= */

function flashAllLights() {

    lightRing.classList.remove(
        "flash-all"
    );

    void lightRing.offsetWidth;

    lightRing.classList.add(

    );

    );

            );

                clearInterval(
                    flashTimer
                );

                lightRing.classList.add(

                );

                    lightRing.classList.remove(
                        "flash-all"
                    );

                }, 500);
            }

        }, 120);
}


/* =========================================================
   DRAW WHEEL
========================================================= */

function drawWheel() {

    const count =
        values.length;

    if (!count) return;

    const size =
        canvas.width;

    const center =
        size / 2;

    const radius =
        size * 0.46;

    ctx.clearRect(
        0,
        0,
        size,
        size
    );

    ctx.save();

    ctx.translate(
        center,
        center
    );

    ctx.rotate(
        rotation
    );

    const slice =
        Math.PI * 2 / count;

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const start =
            i * slice -
            Math.PI / 2;

        const end =
            start + slice;

        ctx.beginPath();

        ctx.moveTo(
            0,
            0
        );

        ctx.arc(
            0,
            0,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle =
            colors[
                i % colors.length
            ];

        ctx.fill();

        ctx.strokeStyle =
            "rgba(255,255,255,.9)";

        ctx.lineWidth =
            Math.max(
                2,
                size * 0.003
            );

        ctx.stroke();

        const text =
            values[i] ||
            String(i + 1);

        const middle =
            start +
            slice / 2;

        const textRadius =
            radius * 0.64;

        ctx.save();

        ctx.translate(
            Math.cos(middle) *
            textRadius,

            Math.sin(middle) *
            textRadius
        );

        let fontSize = 34;

        if (count > 8) fontSize = 28;
        if (count > 12) fontSize = 23;
        if (count > 20) fontSize = 19;
        if (count > 30) fontSize = 16;

        ctx.font =
            `bold ${fontSize}px Arial`;

        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        let textRotation =
            middle;

        if (
            textRotation > Math.PI / 2 &&
            textRotation < Math.PI * 1.5
        ) {
            textRotation += Math.PI;
        }

        ctx.rotate(
            textRotation
        );

        const maxWidth =
            radius *
            slice *
            0.72;

        let displayText =
            text;

        while (
            displayText.length > 1 &&
            ctx.measureText(displayText).width >
                maxWidth
        ) {

            displayText =
                displayText.slice(
                    0,
                    -1
                );
        }

        ctx.fillText(
            displayText,
            0,
            0
        );

        ctx.restore();
    }

    ctx.restore();
}


/* =========================================================
   POINTER
========================================================= */

function getPointerAngle() {

    let angle =
        -Math.PI / 2 -
        rotation;

    angle =
        (
            angle %
            (Math.PI * 2) +
            Math.PI * 2
        ) %
        (Math.PI * 2);

    return angle;
}


/* =========================================================
   VINNARE
========================================================= */

function getWinner() {

    const count =
        values.length;

    if (count === 0) {
        return null;
    }

    const twoPI =
        Math.PI * 2;

    let normalized =
        rotation % twoPI;

    if (normalized < 0) {
        normalized += twoPI;
    }

    const pointerAngle =
        (twoPI - normalized) %
        twoPI;

    const slice =
        twoPI / count;

    let index =
        Math.floor(
            pointerAngle / slice
        );

    if (index >= count) {
        index = count - 1;
    }

    return {
        index: index,
        text:
            values[index] ||
            String(index + 1)
    };
}


/* =========================================================
   RESULT
========================================================= */

function setResult(text) {
    resultValue.textContent = text;
}

function prepareForSpin() {
    setResult(
        translations[currentLanguage].spinning
    );
}

function showWinner() {

    const winner =
        getWinner();

    if (!winner) {
        setResult(
            translations[currentLanguage].spinWheel
        );
        return;
    }

    velocity = 0;
    stopping = false;
    isSpinning = false;
    dragging = false;
    actuallyDragged = false;

    if (animationId !== null) {

        cancelAnimationFrame(
            animationId
        );

        animationId = null;
    }

    stopSpinAudio();

    setResult(
        translations[currentLanguage].winnerPrefix +
        winner.text
    );

    playWinSound();
    launchConfetti();
    flashAllLights();
}


/* =========================================================
   CONFETTI
========================================================= */

function launchConfetti() {

    const amount = 120;

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const piece =
            document.createElement("div");

        piece.className =
            "confetti-piece";

        piece.style.left = "50%";
        piece.style.top = "45%";

        const color =
            lightColors[
                i % lightColors.length
            ];

        piece.style.background =
            color;

        document.body.appendChild(
            piece
        );

        const angle =
            secureRandomFloat() *
            Math.PI *
            2;

        const distance =
            180 +
            secureRandomFloat() *
            500;

        const x =
            Math.cos(angle) *
            distance;

        const y =
            Math.sin(angle) *
            distance +
            300;

        const rotate =
            secureRandomFloat() *
            1000 -
            500;

        const duration =
            1000 +
            secureRandomFloat() *
            1200;

        const animation =
            piece.animate(
                [
                    {
                        transform:
                            "translate(-50%,-50%) rotate(0deg)",
                        opacity: 1
                    },
                    {
                        transform:
                            `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rotate}deg)`,
                        opacity: 0
                    }
                ],
                {
                    duration,
                    easing:
                        "cubic-bezier(.15,.7,.25,1)"
                }
            );

        animation.onfinish =
            () => {
                piece.remove();
            };
    }
}


/* =========================================================
   STOP TARGET
========================================================= */

function easeOutSteadyBrake(t) {

    return 1 -
        Math.pow(
            1 - t,
            3.2
        );
}

function beginStopping(
    releaseVelocity
) {

    if (
        stopping ||
        values.length < 2
    ) {
        return;
    }

    stopping = true;
    isSpinning = true;

    const twoPI =
        Math.PI * 2;

    const count =
        values.length;

    const slice =
        twoPI / count;

    const winnerIndex =
        secureRandomInt(count);

    const safeStart =
        slice * 0.20;

    const safeWidth =
        slice * 0.60;

    const winnerOffset =
        safeStart +
        secureRandomFloat() *
        safeWidth;

    const winnerAngle =
        winnerIndex * slice +
        winnerOffset;

    const desiredRotation =
        -Math.PI / 2 -
        winnerAngle;

    const currentNormalized =
        (
            rotation % twoPI +
            twoPI
        ) % twoPI;

    const targetNormalized =
        (
            desiredRotation % twoPI +
            twoPI
        ) % twoPI;

    let delta =
        targetNormalized -
        currentNormalized;

    if (delta < 0) {
        delta += twoPI;
    }

    const releaseSpeed =
        Math.abs(
            releaseVelocity || 0
        );

    const v0 =
        Math.max(
            releaseSpeed,
            0.02
        ) / 16.67;

    const speedFactor =
        Math.min(
            releaseSpeed / 0.80,
            1
        );

    const targetDuration =
        5000 +
        speedFactor * 6500;

    const neededRotation =
        0.5 *
        v0 *
        targetDuration;

    let turns =
        Math.round(
            (
                neededRotation -
                delta
            ) / twoPI
        );

    turns =
        Math.max(
            turns,
            1
        );

    const totalRotation =
        turns * twoPI +
        delta;

    let duration =
        (
            2 *
            totalRotation
        ) / v0;

    duration =
        Math.min(
            Math.max(
                duration,
                4000
            ),
            11000
        );

    stopStart =
        performance.now();

    stopDuration =
        duration;

    startRotation =
        rotation;

    targetRotation =
        rotation +
        totalRotation;
}


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    if (stopping) {

        const elapsed =
            performance.now() -
            stopStart;

        const t =
            Math.min(
                1,
                elapsed /
                stopDuration
            );

        const eased =
            easeOutSteadyBrake(t);

        rotation =
            startRotation +
            (
                targetRotation -
                startRotation
            ) *
            eased;

        updateSpinAudio();

        drawWheel();
        updateLights();

        if (t >= 1) {

            rotation =
                targetRotation;

            velocity = 0;
            stopping = false;
            isSpinning = false;

            drawWheel();
            updateLights();

            animationId = null;

            showWinner();

            return;
        }

        animationId =
            requestAnimationFrame(
                animate
            );

        return;
    }
}

function startAnimation(
    releaseVelocity
) {

    if (stopping) return;

    if (animationId !== null) {
        return;
    }

    isSpinning = true;

    prepareForSpin();

    startSpinAudio();

    beginStopping(
        releaseVelocity
    );

    animationId =
        requestAnimationFrame(
            animate
        );
}


/* =========================================================
   POINTER POSITION
========================================================= */

function getPointerPositionAngle(
    event
) {

    const rect =
        canvas.getBoundingClientRect();

    const x =
        event.clientX -
        (
            rect.left +
            rect.width / 2
        );

    const y =
        event.clientY -
        (
            rect.top +
            rect.height / 2
        );

    return Math.atan2(
        y,
        x
    );
}


/* =========================================================
   POINTER DOWN
========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        ensureAudio();

        if (
            !gameStarted ||
            stopping
        ) {
            return;
        }

        dragging = true;
        actuallyDragged = false;
        velocity = 0;

        if (
            animationId !== null
        ) {

            cancelAnimationFrame(
                animationId
            );

            animationId = null;

            isSpinning = false;
        }

        lastAngle =
            getPointerPositionAngle(
                event
            );

        lastTime =
            performance.now();

        try {

            canvas.setPointerCapture(
                event.pointerId
            );

        } catch (_) {}
    }
);


/* =========================================================
   POINTER MOVE
========================================================= */

canvas.addEventListener(
    "pointermove",
    event => {

        if (
            !dragging ||
            stopping
        ) {
            return;
        }

        event.preventDefault();

        const now =
            performance.now();

        const angle =
            getPointerPositionAngle(
                event
            );

        let delta =
            angle -
            lastAngle;

        if (delta > Math.PI) {
            delta -=
                Math.PI * 2;
        }

        if (delta < -Math.PI) {
            delta +=
                Math.PI * 2;
        }

        if (delta < 0) {
            delta = 0;
        }

        const dt =
            Math.max(
                1,
                now - lastTime
            );

        if (
            delta >
            0.015
        ) {
            actuallyDragged = true;
        }

        rotation += delta;

        velocity =
            delta /
            dt *
            16;

        velocity =
            Math.max(
                0,
                Math.min(
                    0.80,
                    velocity
                )
            );

        lastAngle =
            angle;

        lastTime =
            now;

        drawWheel();
        updateLights();

        if (actuallyDragged) {

            prepareForSpin();

            startSpinAudio();
        }
    }
);


/* =========================================================
   POINTER UP
========================================================= */

function releasePointer(
    event
) {

    if (!dragging) {
        return;
    }

    dragging = false;

    if (!actuallyDragged) {

        velocity = 0;

        return;
    }

    velocity =
        Math.max(
            0,
            Math.min(
                0.45,
                velocity
            )
        );

    if (stopping) {
        return;
    }

    if (
        velocity >
        0.005
    ) {

        startAnimation(
            velocity
        );
    }
}

canvas.addEventListener(
    "pointerup",
    releasePointer
);

canvas.addEventListener(
    "pointercancel",
    function(event) {

        if (dragging) {

            dragging = false;
            actuallyDragged = false;
            velocity = 0;
        }
    }
);

soundButton.addEventListener(
    "click",
    () => {

        ensureAudio();

        soundEnabled =
            !soundEnabled;

        soundButton.setAttribute(
            "aria-pressed",
            String(soundEnabled)
        );

        soundButton.textContent =
            soundEnabled
                ? translations[currentLanguage].sound
                : translations[currentLanguage].soundOff;

        if (soundEnabled) {

            startBackgroundMusic();

        } else {

            stopBackgroundMusic();
            stopSpinAudio();
        }
    }
);


/* =========================================================
   INITIAL
========================================================= */

createInputs();
createLights();
drawWheel();
updateLights();

setLanguage("pl");

setResult(
    translations[currentLanguage].spinWheel
);
</script>

</body>
</html>
