<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="amusement-park.ico" type="image/x-icon">

    <title>Tivoli – Välj spel</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    #ffe66d 0,
                    transparent 22%
                ),
                radial-gradient(
                    circle at 85% 15%,
                    #ff6b8a 0,
                    transparent 24%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    #62d9ff 0,
                    transparent 30%
                ),
                #ff5c8a;

            color: #fff;

            overflow-x: hidden;
        }


        /* =====================================================
           HUVUD
        ===================================================== */

        .games-screen {
            width: min(800px, 100%);
            text-align: center;
        }


        /* =====================================================
           ÖVRE DEKORATION
        ===================================================== */

        .decoration {
            font-size: 42px;
            margin-bottom: 8px;

            text-shadow:
                0 4px 8px rgba(0, 0, 0, .18);
        }


        /* =====================================================
           RUBRIK
        ===================================================== */

        h1 {
            margin: 0;

            font-size: clamp(48px, 10vw, 82px);

            font-weight: 1000;

            letter-spacing: 5px;

            line-height: .95;

            text-shadow:
                4px 4px 0 #e51d4f,
                7px 7px 0 rgba(0, 0, 0, .18);
        }


        /* =====================================================
           UNDERRUBRIK
        ===================================================== */

        .subtitle {
            margin: 18px 0 35px;

            font-size: 20px;
            font-weight: 900;
        }


        /* =====================================================
           SPEL
        ===================================================== */

        .game-buttons {
            display: flex;

            justify-content: center;
            align-items: stretch;

            gap: 35px;

            width: 100%;
        }


        .game-button {
            width: 250px;
            min-height: 210px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: #fff;

            border: 5px solid #ffd83d;

            border-radius: 25px;

            color: #e51d4f;

            text-decoration: none;

            box-shadow:
                0 7px 0 #c52c51,
                0 12px 25px rgba(0, 0, 0, .22);

            cursor: pointer;

            transition:
                transform .15s ease,
                filter .15s ease,
                box-shadow .15s ease;
        }


        .game-button:hover {
            transform: translateY(-7px);

            filter: brightness(1.04);
        }


        .game-button:active {
            transform: translateY(4px);

            box-shadow:
                0 3px 0 #c52c51,
                0 7px 15px rgba(0, 0, 0, .2);
        }


        /* =====================================================
           SPEL-IKON
        ===================================================== */

        .game-icon {
            font-size: 82px;

            line-height: 1;

            margin-bottom: 18px;

            filter:
                drop-shadow(
                    0 5px 4px rgba(0, 0, 0, .15)
                );
        }


        /* =====================================================
           SPELNAMN
        ===================================================== */

        .game-name {
            font-size: 25px;

            font-weight: 1000;

            letter-spacing: 1px;
        }


        /* =====================================================
           NEDRE DEKORATION
        ===================================================== */.footer-decoration {
            margin-top: 38px;

            font-size: 28px;
        }


        /* =====================================================
           MOBIL
        ===================================================== */

        @media (max-width: 650px) {

            body {
                padding: 12px;
            }


            .decoration {
                font-size: 30px;
            }


            h1 {
                font-size: clamp(44px, 15vw, 70px);

                letter-spacing: 4px;
            }


            .subtitle {
                margin: 14px 0 28px;

                font-size: 17px;
            }


            .game-buttons {
                flex-direction: column;

                align-items: center;

                gap: 22px;
            }


            .game-button {
                width: min(280px, 90vw);

                min-height: 175px;
            }


            .game-icon {
                font-size: 65px;

                margin-bottom: 12px;
            }


            .game-name {
                font-size: 22px;
            }.footer-decoration {
                margin-top: 28px;

                font-size: 23px;
            }
        }


        /* =====================================================
           MYCKET LITEN SKÄRM
        ===================================================== */

        @media (max-width: 380px) {

            .game-button {
                min-height: 155px;

                width: 250px;
            }


            .game-icon {
                font-size: 55px;
            }


            .game-name {
                font-size: 20px;
            }.footer-decoration {
                margin-top: 22px;

                font-size: 20px;
            }
        }

    </style>
</head>


<body>

    <main class="games-screen">


        <!-- ÖVRE DEKORATION -->

        <div class="decoration">
            🎪 ✨ 🎡 ✨ 🎪
        </div>


        <!-- RUBRIK -->

        <h1>TIVOLI</h1>


        <!-- UNDERRUBRIK -->

        <p class="subtitle">
            Välj spel
        </p>


        <!-- SPEL -->

        <section class="game-buttons">


            <!-- LYCKOHJULET -->

            <a
                class="game-button"
                href="svenska.html"
                aria-label="Lyckohjulet"
            >

                <span class="game-icon">
                    🎡
                </span>

                <span class="game-name">
                    LYCKOHJULET
                </span>

            </a>


            <!-- GUNGAN -->

            <a
                class="game-button"
                href="Gunga/gunga-se.html"
                aria-label="Gungan"
            >

                <span class="game-icon">
                    🐒
                </span>

                <span class="game-name">
                    GUNGAN
                </span>

            </a>


        </section>        
        <!-- NYA SPEL KOMMER STRAX -->

        <div
            class="game-button"
            style="margin: 35px auto 0; cursor: default;"
            aria-label="Nya spel kommer strax"
        >

            <span class="game-icon">
                🎟️
            </span>

            <span class="game-name">
                NYA SPEL KOMMER STRAX
            </span>

        </div>

<!-- NEDRE DEKORATION -->

        <div class="footer-decoration">
            🎠 🎟️ 🎪 🎡 🎪 🎟️ 🎠
        </div>


    </main>

</body>
</html>
